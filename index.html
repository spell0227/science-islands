const SEMS=[{"sem": "二上", "rows": [{"p": "einstein", "ch": 1, "name": "基本測量", "ls": [[10, 3], [11, 3], [12, 3]]}, {"p": "einstein", "ch": 2, "name": "物質的世界", "ls": [[13, 3], [14, 3], [15, 3]]}, {"p": "einstein", "ch": 3, "name": "波動與聲音", "ls": [[1, 3], [2, 3], [3, 3], [4, 2]]}, {"p": "einstein", "ch": 4, "name": "光、影像與顏色", "ls": [[5, 2], [6, 3], [7, 3], [8, 3], [9, 2]]}, {"p": "einstein", "ch": 5, "name": "溫度與熱", "ls": [[16, 2], [17, 3], [18, 2], [19, 2], [20, 3]]}, {"p": "atoms", "ch": 6, "name": "物質的基本結構", "ls": [[1, 2], [2, 3], [3, 2], [4, 2], [5, 2]]}]}, {"sem": "二下", "rows": [{"p": "atoms", "ch": 1, "name": "化學反應", "ls": [[6, 2], [7, 2]]}, {"p": "atoms", "ch": 2, "name": "氧化還原反應", "ls": [[8, 3], [9, 2]]}, {"p": "atoms", "ch": 3, "name": "電解質與酸鹼鹽", "ls": [[10, 2], [11, 3], [12, 2], [13, 2]]}, {"p": "atoms", "ch": 4, "name": "反應速率與平衡", "ls": [[14, 2], [15, 2]]}, {"p": "atoms", "ch": 5, "name": "有機化合物", "ls": [[16, 2], [17, 3], [18, 2], [19, 2]]}, {"p": "force", "ch": 6, "name": "力與壓力", "ls": [[1, 3], [2, 3], [3, 3], [4, 3]]}]}, {"sem": "三上", "rows": [{"p": "force", "ch": 1, "name": "直線運動", "ls": [[5, 3], [6, 3], [7, 3], [8, 3]]}, {"p": "force", "ch": 2, "name": "力與運動", "ls": [[9, 2], [10, 2], [11, 2], [12, 2], [13, 3]]}, {"p": "force", "ch": 3, "name": "功與能", "ls": [[14, 2], [15, 2], [16, 3], [17, 3]]}, {"p": "electric", "ch": 4, "name": "電流、電壓與歐姆定律", "ls": [[1, 3], [2, 3], [3, 3], [4, 3]]}, {"p": "earth", "ch": 5, "name": "地球的環境", "ls": [[1, 3], [2, 3], [3, 3]]}, {"p": "earth", "ch": 6, "name": "板塊運動與岩層", "ls": [[4, 3], [5, 3], [6, 3]]}, {"p": "earth", "ch": 7, "name": "浩瀚的宇宙", "ls": [[7, 3], [8, 3], [9, 3]]}]}, {"sem": "三下", "rows": [{"p": "electric", "ch": 1, "name": "電與生活", "ls": [[5, 2], [6, 3], [7, 3], [8, 3]]}, {"p": "electric", "ch": 2, "name": "電與磁", "ls": [[9, 2], [10, 2], [11, 3], [12, 2]]}, {"p": "earth", "ch": 3, "name": "變化莫測的天氣", "ls": [[10, 3], [11, 3], [12, 3], [13, 3]]}, {"p": "earth", "ch": 4, "name": "永續的地球", "ls": [[14, 3], [15, 3], [16, 3]]}]}];const ISLES=[{"id": "einstein", "name": "測量、物質、波、光、熱島", "tag": "波動、光與熱，從測量開始", "key": "science8a-wavelight-v1", "n": 20}, {"id": "atoms", "name": "原子・反應・酸鹼・有機島", "tag": "從原子結構走到有機化合物", "key": "science8-chem-v1", "n": 19}, {"id": "force", "name": "力・運動・功・能島", "tag": "力與壓力、運動定律到能量", "key": "science9a-force-v1", "n": 17}, {"id": "electric", "name": "電與磁島", "tag": "電路、電功率與電磁感應", "key": "science9b-elec-v1", "n": 12}, {"id": "earth", "name": "地球・天氣・宇宙島", "tag": "岩層板塊、天氣與浩瀚宇宙", "key": "science9-earth-v1", "n": 16}];
/* 每座島的低多邊形小圖：沙灘、草地，加上一個代表物 */
const ART={
 einstein:'<path d="M70 62l-22 40h44z" fill="#dfeef5" stroke="#27363a" stroke-width="2"/><path d="M60 80L24 88" stroke="#fff" stroke-width="4"/><path d="M80 82l34-16" stroke="#e53935" stroke-width="3"/><path d="M81 85l34-12" stroke="#fdd835" stroke-width="3"/><path d="M82 88l33-8" stroke="#43a047" stroke-width="3"/><path d="M83 91l32-4" stroke="#3949ab" stroke-width="3"/>',
 atoms:'<path d="M60 42h20v6h-4v20l20 32H44l20-32V48h-4z" fill="#f4f1ff" stroke="#27363a" stroke-width="2"/><path d="M53 86l11-18h12l11 18 7 14H46z" fill="#b57bd8"/><circle cx="66" cy="90" r="3" fill="#fff"/><circle cx="77" cy="82" r="2.4" fill="#fff"/>',
 force:'<path d="M67 66h7v36h-7z" fill="#8a5a33"/><path d="M70 26l32 26-8 22-24 8-24-8-8-22z" fill="#4f9a55"/><path d="M70 26l32 26-32 8-32-8z" fill="#6cb86b"/><circle cx="56" cy="68" r="6" fill="#d9362b"/><circle cx="89" cy="60" r="6" fill="#d9362b"/>',
 electric:'<path d="M58 102l4-8h16l4 8z" fill="#3d4a50"/><path d="M64 94V54h12v40z" fill="#b5652d"/><path d="M64 62h12M64 70h12M64 78h12M64 86h12" stroke="#7a4018" stroke-width="2"/><ellipse cx="70" cy="46" rx="20" ry="8" fill="#c9d3d8" stroke="#27363a" stroke-width="2"/><path d="M92 40l12-8-6 10 12-4M48 40l-12-8 6 10-12-4" fill="none" stroke="#f2b11c" stroke-width="3" stroke-linejoin="round"/>',
 earth:'<circle cx="52" cy="66" r="20" fill="#3f8fc4"/><path d="M40 54l14-4 6 8-8 10-10-4zM54 78l10-6 4 4-6 10z" fill="#6cb86b"/><path d="M84 62l26-20 5 6-24 22z" fill="#c9d3d8" stroke="#27363a" stroke-width="2"/><path d="M92 68l-8 34M92 68l10 34" stroke="#27363a" stroke-width="3"/><circle cx="116" cy="26" r="3" fill="#f2b11c"/><circle cx="26" cy="30" r="2.4" fill="#f2b11c"/>'
};
const isleSVG=k=>'<svg viewBox="0 0 140 130" aria-hidden="true"><path d="M8 104l26-14h74l26 14-14 18H24z" fill="#ead7ac"/><path d="M24 100l18-12h58l18 12-12 10H36z" fill="#a3c77c"/><path d="M42 88h58l18 12H24z" fill="#b9d690"/>'+ART[k]+'</svg>';
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}};
const prog={}; ISLES.forEach(i=>prog[i.id]=LS(i.key));
const lessonGot=(p,[id,sub])=>{const P=prog[p][id]||{};let n=P.match&&P.match.star?1:0;for(let i=0;i<sub;i++) if(P['sub'+i]&&P['sub'+i].star) n++;return n;};
const rowStat=r=>({got:r.ls.reduce((s,l)=>s+lessonGot(r.p,l),0),all:r.ls.reduce((s,l)=>s+l[1]+1,0)});
const NAME=Object.fromEntries(ISLES.map(i=>[i.id,i.name]));
const allRows=SEMS.flatMap(s=>s.rows);
function render(){
  ISLES.forEach(i=>prog[i.id]=LS(i.key));
  const sum=rs=>rs.reduce((a,r)=>{const s=rowStat(r);a.got+=s.got;a.all+=s.all;return a},{got:0,all:0});
  const T=sum(allRows);
  document.getElementById('tot').innerHTML='<i>★</i> '+T.got+' / '+T.all;
  document.getElementById('isles').innerHTML=ISLES.map(i=>{const s=sum(allRows.filter(r=>r.p===i.id)),n=allRows.filter(r=>r.p===i.id).length;
    return '<a class="isle" data-p="'+i.id+'" style="--c:var(--i-'+i.id+')" data-go="'+i.id+'" href="#'+i.id+'">'+isleSVG(i.id)+'<span class="card"><b>'+i.name+'</b><span>'+i.tag+'</span><span>'+n+' 章・'+i.n+' 座小島</span><em><i>★</i> '+s.got+' / '+s.all+'</em></span></a>'}).join('');
  document.getElementById('sems').innerHTML=SEMS.map(S=>'<section class="sem" aria-label="'+S.sem+'"><h3>'+S.sem+'</h3>'+S.rows.map(r=>{const s=rowStat(r);
    return '<a class="row" data-p="'+r.p+'" style="--c:var(--i-'+r.p+')" data-go="'+r.p+'-'+r.ch+'" href="#'+r.p+'-'+r.ch+'" aria-label="'+S.sem+'第'+r.ch+'章 '+r.name+'，在'+NAME[r.p]+'"><span class="n">'+r.ch+'</span><b>'+r.name+'</b><small><span class="who">'+NAME[r.p]+'</span><span><i>★</i> '+s.got+'/'+s.all+'</span></small></a>'}).join('')+'</section>').join('');
  bind();
}
function bind(){document.querySelectorAll('.isle').forEach(a=>{const on=()=>{document.body.classList.add('hl');document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.p===a.dataset.p))},off=()=>document.body.classList.remove('hl');
  a.onmouseenter=on;a.onmouseleave=off;a.onfocus=on;a.onblur=off;});}
render();
/* 島嶼在同一頁內開啟：抓島嶼頁面放進全螢幕框。網址用 #force 或 #force-6，可收藏、可直接分享 */
const $=id=>document.getElementById(id), cache={}, IDS=ISLES.map(i=>i.id);
const getPage=p=>cache[p]||(cache[p]=fetch(p+'.html').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).catch(e=>{delete cache[p];throw e}));
const parseH=()=>{const m=/^#([a-z]+)(?:-(\d+))?$/.exec(location.hash||'');return m&&IDS.includes(m[1])?{p:m[1],ch:m[2]?+m[2]:0}:null};
let tok=0;
function closeIsland(){tok++;const f=$('stagef');if(f)f.remove();$('boat').hidden=true;document.body.classList.remove('in');render();}
async function route(){const h=parseH();closeIsland();if(!h)return;const k=tok;
  const row=h.ch&&allRows.find(r=>r.p===h.p&&r.ch===h.ch);
  $('boatT').textContent=NAME[h.p];$('boatS').textContent=row?'第'+row.ch+'章 '+row.name+'・正在開船':'正在開船';$('boatB').hidden=true;$('boat').hidden=false;document.body.classList.add('in');
  try{const html=await getPage(h.p);if(k!==tok)return;
    const f=document.createElement('iframe');f.id='stagef';f.title=NAME[h.p];f.setAttribute('allow','fullscreen');
    f.srcdoc=html.replace('<head>','<head><script>window.PORTAL_CH='+(row?h.ch:0)+'<\/script>');
    f.onload=()=>{if(k===tok){$('boat').hidden=true;try{f.focus()}catch(e){}}};
    document.body.appendChild(f);
  }catch(e){if(k!==tok)return;$('boatS').textContent='載入失敗，請檢查網路後再試一次';$('boatB').hidden=false;}
}
const goHome=()=>{if(location.hash)location.hash='';else closeIsland();};
$('boatB').onclick=goHome;
addEventListener('message',e=>{if(e.data==='portal-home')goHome();});
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-p]');if(!a)return;e.preventDefault();location.hash=a.dataset.go;});
route();
/* 先在背景備好 3D 程式；手指或滑鼠靠近某座島時，再備好那座島 */
const pre=new Set(),later=h=>{if(pre.has(h))return;pre.add(h);const l=document.createElement('link');l.rel='prefetch';l.href=h;document.head.appendChild(l)};
const idle=window.requestIdleCallback||(f=>setTimeout(f,800));
addEventListener('load',()=>idle(()=>{later('lib/three-r128.js');later('lib/orbit-controls.js')}));
const near=e=>{const a=e.target.closest&&e.target.closest('[data-p]');if(a){later('js/'+a.dataset.p+'.js');getPage(a.dataset.p).catch(()=>{})}};
document.addEventListener('pointerover',near,{passive:true});document.addEventListener('touchstart',near,{passive:true});document.addEventListener('focusin',near);
</script>
</body></html>
